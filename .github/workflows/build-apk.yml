
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'

      - name: Find and build Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -type f -not -path '*/.gradle/*' -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found Android project at: $PROJECT_DIR"

          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudGPU-Hardware-Inspector-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
